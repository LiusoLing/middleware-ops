# ============================================================
# PostgreSQL 客户端认证配置文件 (pg_hba.conf)
# ============================================================
# 格式:
#   TYPE  DATABASE  USER  ADDRESS  METHOD
#
# METHOD 优先级:
#   scram-sha-256 > md5 > password > trust
#
# 规则按顺序匹配，第一个匹配的规则生效
# ============================================================

# 类型声明
local   all             all                                     scram-sha-256

# IPv4 本地连接
host    all             all             127.0.0.1/32            scram-sha-256

# IPv4 局域网连接
host    all             all             192.168.31.0/24         scram-sha-256

# Docker 内部网络（容器间通信）
host    all             all             172.28.0.0/16           scram-sha-256

# 允许所有 Docker 网络（如果你使用多个 Docker 网络）
host    all             all             172.0.0.0/8             scram-sha-256

# 本地 IPv6
host    all             all             ::1/128                 scram-sha-256

# 复制连接（需要时取消注释）
# host  replication     replicator      172.28.0.0/16           scram-sha-256

# ============================================================
# 安全提示:
# - 生产环境不要使用 "trust" 认证方式
# - 外部访问应通过 SSH 隧道或 VPN，不要直接暴露端口
# - 如必须允许外部连接，请限制特定 IP:
#   host  all  all  192.168.1.100/32  scram-sha-256
# ============================================================
