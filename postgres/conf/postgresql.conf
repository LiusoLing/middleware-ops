# ============================================================
# PostgreSQL 生产级配置文件（参考文档）
# ============================================================
# ⚠️ 此文件不再直接挂载到容器！
#
# 当前架构:
#   - conf.d/custom.conf   → 实际生效的自定义参数（通过 include_dir 加载）
#   - pg_hba.conf          → 认证规则（由 initdb/000-config.sh 复制到 PGDATA）
#   - initdb/000-config.sh → 初始化脚本（注入 include_dir + 替换 pg_hba.conf）
#   - 本文件               → 完整参数参考文档，修改后需同步到 conf.d/custom.conf
#
# 适用场景: 开发 / 测试 / 中小型生产环境
# 适用版本: PostgreSQL 18
# 内存假设: 2-4 GB 可用于 PostgreSQL
#
# 调整建议: 根据实际服务器内存调整 shared_buffers 等参数
# ============================================================

# ============================================================
# 连接
# ============================================================
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# ============================================================
# 认证
# ============================================================
password_encryption = 'scram-sha-256'

# ============================================================
# 内存
# ============================================================
# 共享缓冲区: 推荐为总内存的 25%
shared_buffers = '512MB'

# 用于哈希表的临时内存（每个操作可用）
hash_mem_multiplier = 2.0

# 每个连接的 work_mem: 用于排序和哈希表
# 公式: (总内存 - shared_buffers) / (max_connections * 4)
# 这里按 4GB 总内存计算: (4GB - 512MB) / (200 * 4) ≈ 4MB
work_mem = '16MB'

# 维护操作使用的内存 (VACUUM, CREATE INDEX 等)
maintenance_work_mem = '128MB'

# 自动清理工作进程的内存
autovacuum_work_mem = '64MB'

# 最大用于缓存的关系数据页
# 未设置则使用 effective_cache_size
# effective_cache_size = '3GB'

# ============================================================
# 磁盘
# ============================================================

# WAL 相关
# synchronous_commit = 'on'     # 数据安全性最高
# 如果可容忍少量数据丢失，可改为 remote_apply 或 off
synchronous_commit = 'on'

# WAL 写入策略
wal_sync_method = 'fdatasync'

# WAL 缓冲区大小
wal_buffers = '16MB'

# checkpoint 后开始新 WAL 文件的最小时间
# 对于写密集型工作负载，可以减少
# checkpoint_timeout = '15min'

# 检查点之间最大 WAL 大小
max_wal_size = '2GB'
min_wal_size = '256MB'

# WAL 级别: replica 足够用于复制和 PITR
wal_level = 'replica'

# 保留 WAL 的最小数量
wal_keep_size = '512MB'

# ============================================================
# 计划器调优
# ============================================================

# 随机页访问成本 (以顺序页访问成本为单位)
random_page_cost = 1.1   # SSD 环境可以降低
effective_cache_size = '3GB'
default_statistics_target = 100

# 启用 JIT 编译（PostgreSQL 11+，复杂查询加速）
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# ============================================================
# 写入优化
# ============================================================

# 后台写入进程
bgwriter_delay = '200ms'
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ============================================================
# 自动清理 (AUTOVACUUM)
# ============================================================

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = '60s'
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05   # 5% 死元组时触发
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1   # 10% 变化时触发分析
autovacuum_vacuum_cost_delay = '2ms'
autovacuum_vacuum_cost_limit = 200
autovacuum_freeze_max_age = 200000000

# 记录自动清理操作
log_autovacuum_min_duration = '1000ms'

# ============================================================
# 日志
# ============================================================

log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = '0600'
log_rotation_age = '1d'
log_rotation_size = '10MB'
log_truncate_on_rotation = off

# 记录的内容
log_min_duration_statement = '1000ms'  # 记录超过 1 秒的查询
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'Asia/Shanghai'
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0     # 记录所有临时文件
log_replication_commands = on

# 错误报告级别
client_min_messages = 'notice'
log_min_messages = 'warning'
log_error_verbosity = 'default'

# ============================================================
# 统计收集
# ============================================================

track_activities = on
track_counts = on
track_io_timing = on
track_functions = 'pl'
track_wal_io_timing = on
track_activity_query_size = '4096'

# ============================================================
# 客户端默认值
# ============================================================

datestyle = 'iso, mdy'
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# 空闲连接超时
idle_in_transaction_session_timeout = '10min'
idle_session_timeout = '60min'

# 语句超时
statement_timeout = '30s'
lock_timeout = '10s'

# ============================================================
# 复制（单实例注释掉，需要时取消注释）
# ============================================================
# max_wal_senders = 5
# max_replication_slots = 5
# hot_standby = on
# primary_conninfo = 'host=replica_host port=5432 user=replicator password=xxx'
# primary_slot_name = 'replica_slot'

# ============================================================
# 扩展
# ============================================================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000
