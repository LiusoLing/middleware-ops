# ============================================================
# custom.conf — PostgreSQL 自定义参数覆盖
# ============================================================
# 此文件通过 include_dir 机制被 postgresql.conf 自动加载。
# 只包含与 PostgreSQL 默认值不同的参数，其余由 Docker 镜像
# entrypoint 生成的默认配置决定。
#
# 修改此文件后需要重启 PostgreSQL:
#   ./scripts/restart.sh postgres
#
# 完整参数参考: postgres/conf/postgresql.conf（仅作文档保留）
# ============================================================

# ---- 连接 ----
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# ---- 内存 ----
shared_buffers = '512MB'
work_mem = '16MB'
maintenance_work_mem = '128MB'
autovacuum_work_mem = '64MB'
wal_buffers = '16MB'

# ---- 磁盘 / WAL ----
max_wal_size = '2GB'
min_wal_size = '256MB'
wal_keep_size = '512MB'

# ---- 计划器 ----
random_page_cost = 1.1       # SSD 优化
effective_cache_size = '3GB'

# ---- 自动清理 ----
autovacuum_vacuum_scale_factor = 0.05   # 更积极的清理（默认 0.2）
log_autovacuum_min_duration = '1000ms'

# ---- 日志 ----
logging_collector = on
log_directory = '/var/log/postgresql'
log_min_duration_statement = '1000ms'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'Asia/Shanghai'
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_replication_commands = on

# ---- 统计 ----
track_io_timing = on
track_functions = 'pl'
track_wal_io_timing = on
track_activity_query_size = '4096'

# ---- 客户端 ----
timezone = 'Asia/Shanghai'
idle_in_transaction_session_timeout = '10min'
idle_session_timeout = '60min'
statement_timeout = '30s'
lock_timeout = '10s'

# ---- 扩展 ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000
