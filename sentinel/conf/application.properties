# ============================================================
# Sentinel Dashboard Configuration
# ============================================================
# Reference: https://github.com/alibaba/Sentinel/wiki/Dashboard
# SpringBlade ecosystem: bladex/sentinel-dashboard

# Dashboard server port (8858 is SpringBlade default)
server.port=8858

# Login credentials (override via .env: SENTINEL_USERNAME / SENTINEL_PASSWORD)
auth.username=sentinel
auth.password=sentinel

# Session timeout in seconds (default 30 min, extend to 2 hours)
server.servlet.session.timeout=7200

# ============================================================
# Notes:
# - Rules stored in-memory by default; configure Nacos for persistence
#   when moving to production:
#     sentinel.datasource.nacos.server-addr=localhost:8848
# - Access dashboard at http://localhost:8858
# ============================================================
