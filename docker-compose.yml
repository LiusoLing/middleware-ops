# ============================================================
# Middleware Docker Compose
# ============================================================
# 统一管理所有中间件服务
#
# 使用方式:
#   ./scripts/start.sh    # 启动全部服务
#   ./scripts/stop.sh     # 停止全部服务
#   ./scripts/status.sh   # 查看服务状态
#
# 新增服务只需在此文件中添加，脚本自动支持
# ============================================================

# ============================================================
# 网络
# ============================================================
networks:
  default:
    external: false
  docker-network:
    name: docker-network
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}

# ============================================================
# 数据卷
# ============================================================
volumes:
  postgres-data:
    name: postgres-data
  redis-data:
    name: redis-data

# ============================================================
# 服务定义
# ============================================================
services:
  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: postgres-${POSTGRES_VERSION:-18}
    hostname: postgres
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
      
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 数据持久化
      - postgres-data:/var/lib/postgresql/data
      # 自定义参数（通过 include_dir 机制加载，不替换整个 postgresql.conf）
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/conf.d:/etc/postgresql/conf.d:ro
      # pg_hba.conf 模板（由 initdb/000-config.sh 在首次初始化时复制到 PGDATA）
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/pg_hba.conf:/tmp/custom_pg_hba.conf:ro
      # 初始化脚本
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/initdb:/docker-entrypoint-initdb.d:ro

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: redis${REDIS_VERSION:-7}
    hostname: redis
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      # 数据持久化
      - redis-data:/data

    # 启动命令：启用 AOF 持久化 + 设置密码 + 内存限制
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 900 1
      --save 300 10
      --save 60 10000
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --io-threads 4
      --tcp-keepalive 300

    networks:
      - docker-network

    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Sentinel Dashboard
  # ==========================================================
  sentinel:
    image: bladex/sentinel-dashboard:${SENTINEL_VERSION:-latest}
    container_name: sentinel-dashboard
    hostname: sentinel
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Override auth credentials from .env (Spring Boot relaxed binding)
      AUTH_USERNAME: ${SENTINEL_USERNAME:-sentinel}
      AUTH_PASSWORD: ${SENTINEL_PASSWORD:-sentinel}

    ports:
      - "${SENTINEL_PORT:-8858}:8858"

    volumes:
      # Dashboard configuration (mounted as Spring Boot external config)
      - ${SENTINEL_CONF_DIR:-./sentinel/conf}/application.properties:/application.properties:ro

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8858/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Nacos
  # ==========================================================
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.2}
    container_name: nacos-standalone
    hostname: nacos
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 单机模式
      MODE: standalone
      # PostgreSQL 数据源
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: postgres
      MYSQL_SERVICE_PORT: "5432"
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos}
      MYSQL_SERVICE_USER: ${POSTGRES_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: stringtype=unspecified
      # 认证
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}

    ports:
      - "${NACOS_HTTP_PORT:-8080}:8080"
      - "${NACOS_GRPC_CLIENT_PORT:-9080}:9080"
      - "${NACOS_GRPC_SERVER_PORT:-9081}:9081"

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
