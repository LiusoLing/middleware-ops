# ============================================================
# Middleware Docker Compose
# ============================================================
# 统一管理所有中间件服务
#
# 使用方式:
#   ./scripts/start.sh    # 启动全部服务
#   ./scripts/stop.sh     # 停止全部服务
#   ./scripts/status.sh   # 查看服务状态
#
# 新增服务只需在此文件中添加，脚本自动支持
# ============================================================

# ============================================================
# 网络
# ============================================================
networks:
  default:
    external: false
  docker-network:
    name: docker-network
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}

# ============================================================
# 数据卷
# ============================================================
volumes:
  postgres-data:
    name: postgres-data
  redis-data:
    name: redis-data
  dokuwiki-data:
    name: dokuwiki-data
  # SkyWalking 11 / BanyanDB 0.11 使用新的数据格式。
  # 使用新卷名，升级时自动从空数据启动；旧卷 skywalking-banyandb-data 可手动删除。
  skywalking-banyandb-data-v11:
    name: skywalking-banyandb-data-v11

# ============================================================
# 服务定义
# ============================================================
services:
  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: postgres-${POSTGRES_VERSION:-18}
    hostname: postgres
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
      
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 数据持久化
      - postgres-data:/var/lib/postgresql/data
      # 自定义参数（通过 include_dir 机制加载，不替换整个 postgresql.conf）
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/conf.d:/etc/postgresql/conf.d:ro
      # pg_hba.conf 模板（由 initdb/000-config.sh 在首次初始化时复制到 PGDATA）
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/pg_hba.conf:/tmp/custom_pg_hba.conf:ro
      # 初始化脚本
      - ${POSTGRES_CONF_DIR:-./postgres/conf}/initdb:/docker-entrypoint-initdb.d:ro

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: redis${REDIS_VERSION:-7}
    hostname: redis
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      # 数据持久化
      - redis-data:/data

    # 启动命令：启用 AOF 持久化 + 设置密码 + 内存限制
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 900 1
      --save 300 10
      --save 60 10000
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --io-threads 4
      --tcp-keepalive 300

    networks:
      - docker-network

    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Sentinel Dashboard
  # ==========================================================
  sentinel:
    image: ochh/sentinel-dashboard:${SENTINEL_VERSION:-latest}
    container_name: sentinel-dashboard
    hostname: sentinel
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Override auth credentials from .env (Spring Boot relaxed binding)
      AUTH_USERNAME: ${SENTINEL_USERNAME:-sentinel}
      AUTH_PASSWORD: ${SENTINEL_PASSWORD:-sentinel}

    ports:
      - "${SENTINEL_PORT:-8858}:8858"

    volumes:
      # Dashboard configuration (mounted as Spring Boot external config)
      - ${SENTINEL_CONF_DIR:-./sentinel/conf}/application.properties:/application.properties:ro

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8858/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # Nacos
  # ==========================================================
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.2}
    container_name: nacos-standalone
    hostname: nacos
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 单机模式
      MODE: standalone

      # PostgreSQL 数据源
      spring.sql.init.platform: postgresql
      db.num: 1
      db.url: jdbc:postgresql://postgres:5432/${NACOS_DB_NAME:-nacos}
      db.user: ${POSTGRES_USER:-nacos}
      db.password: ${POSTGRES_PASSWORD}
      db.pool.config.driverClassName: org.postgresql.Driver
      db.pool.config.connectionTestQuery: SELECT 1

      # 认证
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SGVsbG9Ob2NvbGFzdGVyU2VjdXJlS2V5Rm9yTmFjb3MyMDI1MDExMQ==}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nosgoz-5qymba-kyzsIj}

    ports:
      - "${NACOS_HTTP_PORT:-8080}:8080"
      - "${NACOS_GRPC_CLIENT_PORT:-9080}:9080"
      - "${NACOS_GRPC_SERVER_PORT:-9081}:9081"
      - "${NACOS_GRPC_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_CLUSTER_PORT:-9849}:9849"

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # DokuWiki
  # ==========================================================
  dokuwiki:
    image: linuxserver/dokuwiki:${DOKUWIKI_VERSION:-latest}
    container_name: dokuwiki
    hostname: dokuwiki
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

    ports:
      - "${DOKUWIKI_PORT:-8088}:80"

    volumes:
      # 持久化 wiki 数据（页面、配置、插件、用户）
      - ./dokuwiki/data:/config
      # 新增：将数据目录挂载到宿主机
      - ./dokuwiki/data:/app/www/public/data

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SkyWalking BanyanDB
  # ==========================================================
  skywalking-banyandb:
    image: apache/skywalking-banyandb:${BANYANDB_VERSION:-0.11.1}
    container_name: skywalking-banyandb
    hostname: skywalking-banyandb
    restart: unless-stopped

    command: standalone

    environment:
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # BanyanDB 默认数据目录位于 /tmp 下
      - skywalking-banyandb-data-v11:/tmp

    networks:
      - docker-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 http://127.0.0.1:17913/api/healthz | grep -q SERVING"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SkyWalking OAP
  # ==========================================================
  skywalking-oap:
    image: apache/skywalking-oap-server:${SKYWALKING_VERSION:-11.0.0}
    container_name: skywalking-oap
    hostname: skywalking-oap
    restart: unless-stopped

    depends_on:
      skywalking-banyandb:
        condition: service_healthy

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      SW_HEALTH_CHECKER: default
      # SkyWalking 11 默认启用以下 admin 模块；Horizon UI 的模板同步、
      # 集群状态、DSL 调试、Inspect 等能力依赖 17128 端口。
      SW_ADMIN_SERVER: default
      SW_RECEIVER_RUNTIME_RULE: default
      SW_DSL_DEBUGGING: default
      SW_INSPECT: default
      SW_UI_MANAGEMENT: default

    ports:
      - "${SKYWALKING_OAP_GRPC_PORT:-11800}:11800"
      - "${SKYWALKING_OAP_HTTP_PORT:-12800}:12800"
      - "${SKYWALKING_OAP_ADMIN_PORT:-17128}:17128"

    networks:
      - docker-network

    healthcheck:
      # OAP 镜像不包含 swctl；检查查询端口与 admin 端口是否均已监听
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12800 && exec 4<>/dev/tcp/127.0.0.1/17128'"]
      interval: 15s
      timeout: 10s
      retries: 20
      # 首次启动需向 BanyanDB 安装全部 schema，耗时可能超过 1 分钟
      start_period: 120s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SkyWalking UI
  # ==========================================================
  # SkyWalking 11 起 UI 独立为 Horizon，版本与 OAP 解耦（Docker Hub tag: horizon-<version>）
  skywalking-ui:
    image: apache/skywalking-ui:${SKYWALKING_UI_VERSION:-horizon-1.0.1}
    container_name: skywalking-ui
    hostname: skywalking-ui
    restart: unless-stopped

    depends_on:
      skywalking-oap:
        condition: service_healthy

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HORIZON_OAP_QUERY_URL: http://skywalking-oap:12800
      HORIZON_OAP_ADMIN_URL: http://skywalking-oap:17128
      # 本地登录用户（JSON 数组，passwordHash 为 Argon2id）
      HORIZON_AUTH_LOCAL_USERS: ${HORIZON_AUTH_LOCAL_USERS:-[]}

    ports:
      - "${SKYWALKING_UI_PORT:-8801}:8081"

    networks:
      - docker-network

    healthcheck:
      # Horizon UI 提供无需认证的健康检查接口
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8081/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
